# Push a tag like v0.2.0 and this builds emocar-server for
# Linux/macOS/Windows and attaches the archives to a GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Test
        working-directory: server
        run: go vet ./... && go test ./...

      - name: Build archives
        working-directory: server
        run: make dist VERSION=${{ github.ref_name }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" server/dist/* \
            --title "emocar-server ${{ github.ref_name }}" \
            --generate-notes
